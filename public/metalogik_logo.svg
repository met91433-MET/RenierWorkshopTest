<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Gear Gradient -->
    <radialGradient id="gearGrad" cx="35%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#3d9154" />
      <stop offset="70%" stop-color="#10572b" />
      <stop offset="100%" stop-color="#07381a" />
    </radialGradient>
    
    <!-- Text Green Gradient -->
    <linearGradient id="textGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a4d25" />
      <stop offset="100%" stop-color="#042612" />
    </linearGradient>

    <!-- Reflection Gradient -->
    <linearGradient id="reflGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a4d25" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background: Transparent -->

  <!-- 8-Teeth Gear -->
  <g transform="translate(420, 400)">
    <!-- Outer Gear Body Path -->
    <path fill="url(#gearGrad)" d="
      M -100,-350 L 100,-350 L 80,-250 A 280,280 0 0,1 177,-202 L 265,-265 L 406,-124 L 320,-36 A 280,280 0 0,1 350,70 L 450,90 L 450,290 L 350,270 A 280,280 0 0,1 280,380 L 350,470 L 210,610 L 120,530 A 280,280 0 0,1 -20,550 L -40,650 L -240,650 L -220,550 A 280,280 0 0,1 -320,490 L -410,570 L -550,430 L -470,340 A 280,280 0 0,1 -490,240 L -590,220 L -590,20 L -490,40 A 280,280 0 0,1 -430,-80 L -510,-170 L -370,-310 L -280,-230 A 280,280 0 0,1 -180,-280 Z
    " />
    <!-- Center Hollow Hole -->
    <circle cx="-120" cy="80" r="140" fill="#ffffff" />
  </g>

  <!-- METALOGIK Text -->
  <g transform="translate(430, 410) skewX(-12)">
    <!-- Main Text -->
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="145" letter-spacing="-2">
      <tspan fill="#0d5229">M</tspan>
      <tspan fill="#facc15">ETAL</tspan>
      <tspan fill="#0d5229">OGIK</tspan>
    </text>

    <!-- Reflection Effect -->
    <g transform="translate(0, 30) scale(1, -0.45)">
      <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="145" letter-spacing="-2" fill="url(#reflGrad)">
        METALOGIK
      </text>
    </g>
  </g>
</svg>
